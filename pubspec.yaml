name: pro_image_editor
description: "A Flutter image editor: Seamlessly enhance your images with user-friendly editing features."
version: 13.3.1
homepage: https://github.com/hm21/pro_image_editor/
repository: https://github.com/hm21/pro_image_editor/
documentation: https://github.com/hm21/pro_image_editor/
funding:
  - https://github.com/sponsors/hm21

topics:
  - image-editor
  - image
  - photo
  - picture
  - editor

screenshots:
  - description: "Showcase from the image editor with the frosted-glass design"
    path: assets/showcase-frosted-glass.jpg
  - description: "Showcase from the image editor with the WhatsApp design"
    path: assets/showcase-whatsapp.jpg
  - description: "Showcase from the image editor with simple design"
    path: assets/showcase.jpg

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  plugin_platform_interface: ^2.1.8
  shared_preferences: ^2.5.4
  vector_math: ^2.2.0
  web: ^1.1.1
  # 供 pixelsmix 离屏渲染管线使用（与 pixelsmix_filters 传递依赖同版本）
  flutter_image_filters: ^0.0.28
  # Pixelsmix 自定义滤镜包（git 依赖，锁定 master 分支）
  pixelsmix_filters:
    git:
      url: https://github.com/SunXingZ/pixelsmix_filters.git
      ref: master

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.11.1
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0
  mockito: ^5.6.3
  network_image_mock: ^2.1.1

flutter:
  plugin:
    platforms:
      android:
        package: ch.waio.pro_image_editor
        pluginClass: ProImageEditorPlugin
      ios:
        pluginClass: ProImageEditorPlugin
        sharedDarwinSource: true
      macos:
        pluginClass: ProImageEditorPlugin
        sharedDarwinSource: true
  assets:
    - path: lib/web/web_worker.dart.js
      platforms: [web]
    - path: lib/web/web_worker.dart.js.map
      platforms: [web]
  shaders:
    - lib/shared/shaders/pixelate.frag
    - lib/shared/shaders/pixelsmix/color_matrix.frag
    - lib/shared/shaders/pixelsmix/tone_curve.frag
    - lib/shared/shaders/pixelsmix/hsl_mix.frag
    - lib/shared/shaders/pixelsmix/color_balance.frag
    - lib/shared/shaders/pixelsmix/tone_separation.frag
    - lib/shared/shaders/pixelsmix/vibrance.frag
    - lib/shared/shaders/pixelsmix/haze.frag
    - lib/shared/shaders/pixelsmix/highlight_shadow.frag
    - lib/shared/shaders/pixelsmix/sharpen.frag
    - lib/shared/shaders/pixelsmix/noise.frag
    - lib/shared/shaders/pixelsmix/vignette.frag
    - lib/shared/shaders/pixelsmix/lut.frag
    - lib/shared/shaders/pixelsmix/selective_blur.frag
    - lib/shared/shaders/pixelsmix/tilt_shift_blur.frag
  fonts:
   - family: ProImageEditorIcons
     fonts:
      - asset: assets/fonts/ProImageEditorIcons.ttf